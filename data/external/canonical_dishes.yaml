# Biblioteca de platillos canónicos (SINTÉTICA, declarada en docs/supuestos.md, S1).
#
# - Los ALÉRGENOS NO se escriben por platillo: se DERIVAN de los ingredientes
#   (un solo lugar de verdad). Base: NOM-051 + moluscos y ajonjolí.
# - price: precio típico en MXN para un restaurante de nivel medio en CDMX.
#   El precio final se ajusta por restaurante en simulation/menus.py.
# - cuisine: general = disponible para cualquier cocina (bebidas, postres comunes).
# - spice: 0 (nada) a 3 (muy picante). shareable: se pide para la mesa.
# - aliases: variaciones reales del nombre en la carta (alimentan la homologación).

