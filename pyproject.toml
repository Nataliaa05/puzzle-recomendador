[project]
name = "puzzle-recsys"
version = "0.1.0"
description = "Recomendador de platillos de Puzzle (proyecto CRISP-DM + módulo de producto)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "shap>=0.46",
    "mlflow>=2.16",
    "geopandas>=1.0",
    "prince>=0.13",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
puzzle = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.6", "pre-commit>=3.8"]

[project.scripts]
puzzle-simulate = "puzzle_recsys.pipelines.simulate:main"
puzzle-build-dataset = "puzzle_recsys.pipelines.build_dataset:main"
puzzle-train = "puzzle_recsys.pipelines.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D", "NPY", "PD", "SIM", "RUF"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402", "F401"]  # las plantillas importan utilidades que se usan después
