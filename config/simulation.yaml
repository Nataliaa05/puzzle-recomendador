# Parámetros de la simulación.
# Los valores son INICIALES DE TRABAJO: se calibran en notebooks/04 y cada
# corrida guarda una copia de este archivo en data/synthetic/<run_id>/.

seed: 20261116
run_name: base
metro_area: CDMX            # 16 alcaldías (CVE_ENT 09). Ampliable a la ZM del Valle de México

scale:
  n_restaurants: 1500
  n_diners: 20000
  months: 12

world:
  # Universo de clientes posibles de Puzzle: servicio en mesa o cafetería.
  # Excluidos: 722516 autoservicio, 722518 para llevar, 722519 otros alimentos.
  include_scian: ["722511", "722512", "722513", "722514", "722515", "722517"]
  min_staff_band: "6 a 10 personas"   # proxy de "tiene meseros y mesas"
  stratify_by: [scian_code, cve_mun]
  cuisine_knn:
    n_neighbors: 15
    min_confidence: 0.4               # debajo de esto → default_cuisine
    default_cuisine: mexicana
    holdout_fraction: 0.2             # para medir la exactitud de la imputación
    geo_weight: 0.0                   # la ubicación EMPEORA la imputación (F1 0.37 vs 0.25), ver notebook 01
    min_df: 2

supply:
  # Tamaño del menú según el personal ocupado (DENUE): restaurantes grandes, cartas más largas.
  # Se recorta si la cocina no tiene suficientes platillos en la biblioteca.
  menu_size_by_staff_band:
    "6 a 10 personas": {min: 12, max: 25}
    "11 a 30 personas": {min: 18, max: 35}
    "31 a 50 personas": {min: 25, max: 45}
    default: {min: 30, max: 55}      # 51 personas o más
  course_mix: {MAIN: 0.45, STARTER: 0.20, DRINK: 0.20, DESSERT: 0.10, SIDE: 0.05}
  cross_cuisine_rate: 0.08           # % del menú con platillos de otras cocinas
  price:
    ses_elasticity: 0.12             # log-precio por 1 desv. estándar de escolaridad del AGEB
    restaurant_sigma: 0.15           # dispersión lognormal entre restaurantes
    item_sigma: 0.08                 # dispersión lognormal entre platillos del mismo restaurante
    nine_ending_rate: 0.3            # precios psicológicos: terminan en 0, 5 o 9
  name_variation_rate: 0.6           # % de platillos con nombre distinto al canónico
  name_noise: {alias: 0.6, decorate: 0.3, typo: 0.1}
  recipe_variation_rate: 0.1         # % de platillos que quitan un ingrediente no principal
  canonical_confirmation_rate: 0.7   # % de sugerencias KNN que el restaurante confirma/corrige (nb 09)
  evolution:                         # por mes
    new_item_rate: 0.03
    archive_rate: 0.02
    price_change_rate: 0.05
    price_increase: {min: 1.03, max: 1.12}
    daily_sold_out_rate: 0.02
    max_daily_sold_out_rate: 0.15     # tope por platillo (agotados según la demanda)

calendar:
  start_date: "2025-01-06"           # lunes
  timezone: America/Mexico_City

population:
  budget:
    outings_per_quarter: 8             # salidas a comer por persona y trimestre (supuesto S2)
    smoothing_sigma: 0.15              # ancho del kernel lognormal del bootstrap suavizado
    decile_window: 1                   # ± deciles de ingreso alrededor del percentil SES del comensal
    spend_per_visit_elasticity: 0.4    # γ: parte del gasto extra que va a ticket (el resto, a salir más)
  taste:
    cuisine_concentration: 3.0         # Dirichlet: total de la concentración (bajo = fiel a pocas cocinas)
    protein_concentration: 4.0
    ingredient_like_rate: 0.04         # prob. de que un ingrediente le guste especialmente
    ingredient_dislike_rate: 0.03      # prob. de que lo evite
    spice_tolerance_probs: [0.20, 0.35, 0.30, 0.15]   # 0 nada … 3 muy picante
    price_sensitivity_lognormal: {mu: 0.0, sigma: 0.4}  # λ por comensal
    distance_sensitivity_lognormal: {mu: -1.0, sigma: 0.5}  # β por comensal (por km)
    variety_seeking_beta: {a: 2.0, b: 5.0}
    sharer_trait_beta: {a: 1.5, b: 6.0}
    course_habit_beta:                 # prob. de pedir cada tipo de plato en una visita
      STARTER: {a: 2.0, b: 4.0}
      DRINK: {a: 5.0, b: 2.0}
      DESSERT: {a: 1.5, b: 5.0}
      SIDE: {a: 1.0, b: 8.0}
    taste_drift_blend: 0.02            # mezcla mensual de la afinidad con un nuevo sorteo Dirichlet
  diets: {vegetariano: 0.06, vegano: 0.015}
  allergy_prevalence:                  # supuesto S10 (orden de magnitud de literatura en adultos)
    crustaceos: 0.020
    lacteos: 0.020
    cacahuate: 0.010
    frutos_secos: 0.010
    gluten: 0.010
    pescado: 0.008
    huevo: 0.008
    moluscos: 0.008
    soya: 0.004
    ajonjoli: 0.003
    sulfitos: 0.003
  onboarding:
    completion_rate: 0.6
    answer_flip_rate: 0.15             # ruido de las respuestas frente a la verdad
    allergies_reported_rate: 0.9       # quien completa el onboarding declara sus alergias

visits:
  inter_visit_weibull: {shape: 1.3, scale_days: 21}
  frequency_lognormal_sigma: 0.4       # ruido individual sobre la frecuencia derivada del gasto
  weekday_weights: [0.10, 0.11, 0.12, 0.14, 0.19, 0.20, 0.14]   # lunes … domingo
  hourly_profile:                      # supuesto S15 (hora local: peso; se normaliza)
    "8": 0.03
    "9": 0.06
    "10": 0.05
    "11": 0.03
    "12": 0.04
    "13": 0.08
    "14": 0.17
    "15": 0.14
    "16": 0.05
    "17": 0.03
    "18": 0.04
    "19": 0.08
    "20": 0.15
    "21": 0.14
    "22": 0.08
  pax_probs: {1: 0.18, 2: 0.36, 3: 0.17, 4: 0.16, 5: 0.07, 6: 0.06}   # base: entre semana, comida o cena
  party_size_context:                  # supuesto S16: el contexto deforma pax_probs
    large_from: 3                      # "mesa grande" = 3 personas o más
    weekend_factor: 1.4                # viernes a domingo: salidas en familia y con amigos
    breakfast_factor: 0.7              # el desayuno es más individual o en pareja
  min_hours_between_visits: 3          # una persona no puede estar en dos mesas en menos de 3 h
  registered_companion_rate: 0.25      # % de acompañantes que también son usuarios registrados
  companion_neighbors: 200             # los acompañantes registrados salen de sus 200 vecinos más cercanos
  main_course_rate: 0.95               # prob. de que cada comensal pida plato fuerte
  anonymous_pool_size: 5000            # gustos de acompañantes NO registrados (no se guardan como comensales)
  consideration_set_size: 30
  max_distance_km: 15

choice:
  gumbel_scale: 1.0
  affinity_weight: 1.0                 # cocina
  protein_weight: 0.6
  ingredient_weight: 0.5
  spice_penalty: 1.2                   # por nivel de picante por encima de la tolerancia
  popularity_alpha: 0.8                # cola larga: atractivo latente ∝ rango^-alpha (por tipo de plato)
  item_quality_laplace_scale: 0.3      # calidad de ejecución de cada restaurante (colas pesadas)
  loyalty_weight: 0.4                  # log(1 + visitas previas al restaurante)
  position_effect: 0.0                 # 0 = sin sesgo de posición (se usa en el A/B simulado)
  price_budget_weight: 0.5             # precio ideal = típico_del_menú^(1-w) · presupuesto^w (anclaje)
  occasion:                            # aniversarios, cumpleaños: más presupuesto, menos sensibilidad
    probability: 0.05
    weekend_factor: 2.0                # viernes y sábado, el doble de probable
    budget_multiplier: {min: 2.0, max: 3.5}
    price_sensitivity_factor: 0.5      # solo al pedir platillos (no al elegir lugar)
    pricey_pool: 300                   # restaurantes más caros de la ciudad considerados
    extra_candidates: 20               # cuántos de ellos (dentro del radio) entran al conjunto
    distance_sensitivity_factor: 0.4   # en una ocasión se acepta ir más lejos
  context:                             # supuesto S16: no se come igual a las 9 que a las 21
    weight: 1.0                        # escala de los multiplicadores de cocina (en log)
    cuisine_period:                    # [desayuno, comida, cena]; cocina no listada = 1 (neutral)
      cafeteria: [3.0, 0.8, 0.5]
      familiar_cadena: [2.0, 1.0, 0.7]
      antojitos: [1.4, 0.9, 1.3]
      mexicana: [1.3, 1.2, 0.7]
      mexicana_regional: [0.7, 1.2, 1.0]
      tacos_tortas: [0.8, 0.9, 1.5]
      mariscos: [0.3, 1.5, 0.6]        # la marisquería en CDMX es de mediodía
      pizza: [0.15, 0.8, 1.4]
      hamburguesas: [0.2, 0.9, 1.3]
      pollo: [0.3, 1.3, 0.9]
      japonesa: [0.1, 1.0, 1.3]
      china: [0.1, 1.1, 1.1]
      otras_asiaticas: [0.1, 1.0, 1.2]
      italiana: [0.2, 1.0, 1.3]
      argentina_cortes: [0.1, 1.1, 1.3]
      espanola: [0.2, 1.1, 1.2]
      francesa: [0.6, 1.0, 1.1]
      vegetariana: [1.0, 1.1, 0.9]
      medio_oriente: [0.3, 1.0, 1.2]
      peruana: [0.2, 1.2, 1.0]
    course_rate_period:                # multiplica la prob. de pedir cada tipo de plato
      desayuno: {MAIN: 0.9, DRINK: 1.25, STARTER: 0.5, SIDE: 0.6, DESSERT: 0.7}
      comida: {STARTER: 1.2}           # la sopa de la comida corrida
      cena: {MAIN: 0.95, DRINK: 1.1, DESSERT: 1.1}
    breakfast_dishes: [chilaquiles_verdes, chilaquiles_cafe, huevos_rancheros, huevos_motulenos,
                       molletes, molletes_cadena, hot_cakes, hotcakes_cadena, bowl_avena, concha,
                       croissant, tamal, atole, cafe_americano, cafe_latte, espresso, cafe_refill,
                       chocolate_caliente, jugo_naranja, jugo_verde, smoothie]
    breakfast_bonus: {desayuno: 1.0, comida: -0.3, cena: -0.6}
    alcohol_ingredients: [cerveza, vino, tequila, mezcal]
    alcohol_bonus: {desayuno: -2.5, comida: 0.0, cena: 0.5}

sharing:
  base_probability: 0.15
  pax_slope: 0.08
  sharer_weight: 1.0                   # mesas de gente compartidora comparten más (S17)
  least_misery_weight: 0.3             # mezcla promedio / miseria mínima (entre quienes lo comen)
  exclusion_penalty: 0.5               # costo social por la fracción de la mesa que no puede comerlo

ratings:
  dish_base_rate: 0.12
  experience_noise_laplace: 0.5        # lo vivido difiere de lo esperado (colas pesadas)
  visit_base_rate: 0.20
  mnar_extremity_weight: 1.5           # califica más quien quedó muy contento o muy molesto
  cutpoints_quantiles: [0.08, 0.15, 0.40, 0.75]   # → estrellas 1..5 (forma de J: 1★ > 2★)

noise:
  waiter_unassigned_rate: 0.04         # pedidos del mesero sin comensal asignado
  duplicate_account_rate: 0.01         # comensales que se registran dos veces
  outlier_party_rate: 0.002            # mesas de 12 a 30 personas
  outlier_party_size: {min: 12, max: 30}

calibration:
  method: latin_hypercube
  n_samples: 30
  params: [choice.gumbel_scale, population.price_sensitivity_lognormal.sigma, choice.affinity_weight]
