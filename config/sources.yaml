# Fuentes públicas. Se descargan a data/raw/<file> con puzzle_recsys.sources.download.
# OJO: el servidor del INEGI responde Content-Type text/html aunque entregue un ZIP;
# por eso la descarga valida el archivo por su contenido (firma "PK"), no por el encabezado.

denue:
  description: DENUE INEGI, Ciudad de México (todos los sectores)
  url: https://www.inegi.org.mx/contenidos/masiva/denue/denue_09_csv.zip
  file: denue_09_csv.zip

census_ageb:
  description: Censo de Población y Vivienda 2020, resultados por AGEB y manzana urbana, CDMX
  url: https://www.inegi.org.mx/contenidos/programas/ccpv/2020/datosabiertos/ageb_manzana/ageb_mza_urbana_09_cpv2020_csv.zip
  file: ageb_mza_urbana_09_cpv2020_csv.zip

marco_geo:
  description: Marco Geoestadístico (Censo 2020), Ciudad de México
  url: https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/889463807469/09_ciudaddemexico.zip
  file: 09_ciudaddemexico.zip

enigh:
  description: ENIGH 2024 (INEGI), concentrado de hogares — gasto en alimentos fuera del hogar
  url: https://www.inegi.org.mx/contenidos/programas/enigh/nc/2024/microdatos/enigh2024_ns_concentradohogar_csv.zip
  file: enigh2024_ns_concentradohogar_csv.zip
